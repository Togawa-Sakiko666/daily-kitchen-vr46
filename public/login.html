<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#121b38"><title>VR46 · 登录</title>
<style>
:root{color-scheme:light;--navy:#121b38;--yellow:#d9ff00;--muted:#697180}*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:var(--navy);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100svh;display:flex;flex-direction:column}header{width:min(1180px,100%);margin:auto auto 0;padding:30px 40px;display:flex;align-items:center;justify-content:space-between}.brand{display:inline-flex;align-items:center;background:var(--yellow);padding:8px 20px 8px 12px;font:italic 900 27px/1 Arial,sans-serif;letter-spacing:-2px;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}.header-note{font-size:10px;letter-spacing:2px;color:var(--muted)}main{width:min(1100px,calc(100% - 80px));margin:0 auto;display:grid;grid-template-columns:1.05fr 1fr;min-height:570px;border:1px solid #e0e3e7;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px #121b3809}.story{background:var(--navy);color:#fff;padding:44px;position:relative;display:flex;flex-direction:column;overflow:hidden}.eyebrow{font-size:10px;font-weight:650;letter-spacing:2px;color:var(--yellow);margin:0}.emblem{width:270px;max-width:90%;height:190px;margin:30px auto 22px;overflow:visible;color:var(--yellow)}.story h1{font-size:36px;line-height:1.25;letter-spacing:-1px;margin:0 0 15px;font-weight:800}.story h1 span{color:var(--yellow)}.story p.caption{color:#bbc3d6;line-height:1.9;font-size:13px;margin:0;max-width:300px}.story-bottom{margin-top:auto;padding-top:32px;display:flex;gap:10px;align-items:center;font-size:10px;letter-spacing:2px;color:#aab5ce}.story-bottom:before{content:"";width:27px;height:3px;background:var(--yellow)}.form-panel{background:white;padding:64px 54px;display:flex;flex-direction:column;justify-content:center}.form-kicker{font-size:10px;font-weight:700;letter-spacing:2px;color:#87909f;margin:0 0 13px}.form-panel h2{font-size:29px;letter-spacing:-.8px;margin:0 0 10px}.intro{color:var(--muted);font-size:13px;margin:0 0 30px;line-height:1.7}label{display:block;font-size:12px;font-weight:650;margin:0 0 9px}input{font:inherit;font-size:15px;color:var(--navy);background:#fafbfc;border:1px solid #dce1e9;border-radius:7px;width:100%;height:52px;padding:0 15px;transition:border-color .15s,box-shadow .15s;outline:none}input::placeholder{color:#9aa2af;font-size:13px}input:focus{border-color:#64734d;box-shadow:0 0 0 3px #d9ff0038;background:#fff}.field{margin-bottom:21px}button{width:100%;min-height:52px;border:0;border-radius:7px;background:var(--yellow);color:var(--navy);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:28px;transition:background .15s,transform .15s}button span{font-size:14px;font-weight:750}button:hover{background:#cbed00}button:active{transform:translateY(1px)}button:focus-visible{outline:2px solid var(--navy);outline-offset:4px}button:disabled{opacity:.6;cursor:wait}button svg{width:18px;height:18px}#error{font-size:12px;color:#a33b35;line-height:1.65;margin:14px 0 0}#error:empty{display:none}.private-note{display:flex;gap:7px;align-items:center;justify-content:center;color:#9299a5;font-size:11px;margin:22px 0 0}.private-note svg{width:13px;height:13px;flex-shrink:0}footer{width:min(1180px,100%);margin:0 auto auto;padding:25px 40px 30px;display:flex;justify-content:space-between;color:#8a929c;font-size:10px;letter-spacing:.5px}footer span:last-child{letter-spacing:1.5px}@media(max-width:720px){header{padding:24px;margin-top:0}.header-note{font-size:8px;letter-spacing:1px}main{width:calc(100% - 40px);grid-template-columns:1fr;min-height:0;border-radius:12px}.story{padding:24px 26px;min-height:180px;justify-content:center}.story .eyebrow{font-size:8px;letter-spacing:1px;margin-bottom:20px}.story h1{font-size:26px;margin:0;position:relative;z-index:1;max-width:180px}.story .caption,.story-bottom{display:none}.emblem{position:absolute;width:155px;height:120px;right:-18px;top:24px;margin:0;opacity:.85}.form-panel{padding:32px 26px 30px}.form-kicker{display:none}.form-panel h2{font-size:25px}.intro{margin-bottom:25px;font-size:12px}footer{padding:20px 24px;margin-bottom:0}.field{margin-bottom:18px}button{margin-top:24px}}@media(max-width:360px){main{width:calc(100% - 28px)}header{padding:20px}.form-panel{padding:28px 22px}.story{padding:22px}.story h1{font-size:24px}.emblem{right:-30px;width:140px}footer span:last-child{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="brand" aria-label="VR46">VR46</div><span class="header-note">PERSONAL KITCHEN CLUB</span></header>
<main>
<section class="story" aria-label="VR46 私人料理俱乐部">
<p class="eyebrow">SOLE / LUNA · DAILY KITCHEN</p>
<svg class="emblem" viewBox="0 0 330 210" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="3"><circle cx="88" cy="95" r="43"/><path d="M83 39 88 15 93 39ZM83 151 88 175 93 151ZM32 90 8 95 32 100ZM144 90 168 95 144 100ZM44 58 27 34 51 51ZM125 139 149 156 132 132ZM44 132 27 156 51 139ZM125 51 149 34 132 58Z" fill="currentColor" stroke="none"/></g><path d="M207 24a75 75 0 1 1-1 143 76 76 0 0 0 1-143Z" fill="currentColor"/><path d="M90 99h165v79H90z" fill="#121b38"/><text x="102" y="174" fill="currentColor" font-family="Arial,sans-serif" font-size="101" font-weight="900" font-style="italic" letter-spacing="-9">46</text></svg>
<h1>VR46<br><span>KITCHEN</span></h1><div class="story-bottom">PERSONAL CLUB</div>
</section>
<section class="form-panel" aria-labelledby="welcome"><p class="form-kicker">WELCOME BACK / 01</p><h2 id="welcome">登录</h2>
<form id="login"><div class="field"><label for="username">账号</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="输入你的账号" maxlength="200" required></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入你的密码" maxlength="500" required></div><button type="submit"><span>登录</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button><p id="error" role="alert"></p></form>
<p class="private-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>私人账号</p></section>
</main><footer><span>46 / DAILY CLUB</span></footer>
<script src="/login.js"></script></body></html>
